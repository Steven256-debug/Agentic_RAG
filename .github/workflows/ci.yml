name: Agentic RAG CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Speeds up runs by caching dependencies
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Build Vector Database
      # This step rebuilds the ChromaDB vector store from the raw PDFs in the repo
      run: |
        echo "Running chunking and ingestion..."
        python src/ingest.py
        echo "Running embedding and vector DB creation..."
        python src/embed.py
        
    - name: Run RAG Evaluation Suite
      # Only runs if you have added your GEMINI_API_KEY to GitHub Secrets
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        if [ -n "$GEMINI_API_KEY" ]; then
          echo "API key found. Running LLM evaluation suite..."
          python src/evaluate.py
        else
          echo "Notice: GEMINI_API_KEY secret not found in GitHub. Skipping LLM evaluation."
          echo "Go to GitHub Repo -> Settings -> Secrets and variables -> Actions to add it."
        fi
